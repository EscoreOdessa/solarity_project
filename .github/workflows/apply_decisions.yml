name: Рішення по довіднику (разово)

# Запуск лише вручну: Actions → «Рішення по довіднику (разово)» → Run workflow.
# Спочатку — пробний запуск (галочка стоїть за замовчуванням), потім — без неї.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробний запуск: лише показати, що буде змінено"
        type: boolean
        default: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Застосувати рішення
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python apply_decisions.py
